<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Club</title>
</head>

<body>
    <h1>Tech Club</h1>
    <h2>Student Registration</h2>
    <form>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone">
        <br><br>

        <label>Gender:</label>
        <input type="radio" name="gender" id="male" value="Male"> Male
        <input type="radio" name="gender" id="female" value="Female"> Female
        <br><br>
        <!--SECOHD METHOD-->
        <!--<P>Gender:</P>
        <label>
            <input type="radio" id="male" name="gender" value="Male">
            Male</label>
        <label>
            <input type="radio" id="female" name="gender" value="Female">
            Female</label> -->

        <label>Interests:</label>
        <input type="checkbox" id="web development" name="interest" value="web development"> Web Development
        <input type="checkbox" id="DSA" name="interest" value="DSA"> DSA
        <br><br>

        <label>Select Event:</label>
        <select name="event" id="event">
            <option value="HTML workshop">HTML Workshop</option>
            <option value="hackathon">Hackathon</option>
            <option value="robotics">Robotics</option>
        </select>
        <br><br>

         <label for="message">Message:</label>
         <br>
         <textarea name="message" id="message" rows="4" cols="30"></textarea>
         <br><br>

         
        <button type="submit">Register</button>
    </form>


</body>

</html>
