 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WanderGo - Travel Plans</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <h2 class="logo">WanderGo</h2>

        <nav class="nav-links">
            <a href="#home">Home</a>
            <a href="#trips">Trips</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main>
        <section class="hero" id="home">
            <h1>Plan your next trip in minutes</h1>
            <p>Simple, cheap and fun travel plans.</p>

            <div class="hero-image">img/hero.jpg</div>
        </section>

        <section class="features" id="trips">
            <article class="card">
                <h3>Easy Booking</h3>
                <p>Book in 3 clicks.</p>
            </article>

            <article class="card">
                <h3>Best Prices</h3>
                <p>We compare for you.</p>
            </article>

            <article class="card" id="contact">
                <h3>24x7 Help</h3>
                <p>We are here to help.</p>
            </article>
        </section>
    </main>

</body>
</html>
